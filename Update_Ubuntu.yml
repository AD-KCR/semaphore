---
- name: Manage Ubuntu Updates
  hosts: all
  become: true
  vars:
    # Set to true in Semaphore environment variables to only check without installing
    check_only: false

  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        force_apt_get: true

    - name: Check for available updates (Dry Run)
      ansible.builtin.apt:
        upgrade: dist
        force_apt_get: true
      check_mode: true
      register: check_output
      changed_when: check_output.changed

    - name: Display upgrade simulation results
      ansible.builtin.debug:
        msg: "Updates are available! Review the Semaphore task log for details."
      when: check_output.changed

    - name: Apply all available updates
      ansible.builtin.apt:
        upgrade: dist
        force_apt_get: true
      register: update_output
      when: not check_only and check_output.changed

    - name: Check if a reboot is required
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required_file

    - name: Reboot the server if required
      ansible.builtin.reboot:
        msg: "Reboot initiated by Ansible Semaphore after updates"
        connect_timeout: 5
        reboot_timeout: 300
        pre_reboot_delay: 0
        post_reboot_delay: 30
        test_command: whoami
      when: not check_only and reboot_required_file.stat.exists
